# NFR-M7: dependencies are reviewed at least monthly. Security updates arrive as soon as an
# advisory is published (Dependabot security updates, enabled in repository settings).
# Major upgrades still need an ADR before merging (docs/runbooks/dependency-updates.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
